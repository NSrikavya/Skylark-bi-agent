<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skylark BI Agent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    max-width: 700px;
    margin: 40px auto;
    background: #f5f6f8;
    color: #1a1a1a;
  }
  h1 { font-size: 20px; }
  #chat {
    background: white;
    border-radius: 8px;
    padding: 16px;
    min-height: 400px;
    max-height: 500px;
    overflow-y: auto;
    border: 1px solid #ddd;
  }
  .msg { margin: 10px 0; line-height: 1.5; white-space: pre-wrap; }
  .user { text-align: right; color: #0b5cff; }
  .agent { text-align: left; color: #1a1a1a; }
  .agent b { color: #0b5cff; }
  #inputRow { display: flex; margin-top: 12px; gap: 8px; }
  #userInput { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
  #sendBtn { padding: 10px 18px; border: none; background: #0b5cff; color: white; border-radius: 6px; cursor: pointer; }
  #sendBtn:disabled { background: #aac1f5; cursor: default; }
  .loading { color: #888; font-style: italic; }
  .agent h3 { font-size: 15px; margin: 12px 0 4px; }
  .agent p { margin: 6px 0; }
  .agent ul { margin: 4px 0; padding-left: 20px; }
  .agent li { margin: 2px 0; }
  .agent hr { border: none; border-top: 1px solid #e0e0e0; margin: 10px 0; }
  .agent strong { color: #0b0b0b; }
</style>
</head>
<body>

<h1>Skylark Drones — Business Intelligence Agent</h1>
<div id="chat"></div>
<div id="inputRow">
  <input type="text" id="userInput" placeholder="Ask a business question..." />
  <button id="sendBtn">Send</button>
</div>

<script>
  // Change this to your deployed backend URL once hosted
  const API_URL = "https://skylark-bi-agent-4v2e.onrender.com/chat";
  const sessionId = "web-" + Math.random().toString(36).slice(2);

  const chatEl = document.getElementById("chat");
  const inputEl = document.getElementById("userInput");
  const btnEl = document.getElementById("sendBtn");

  function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = "msg " + sender;
    if (sender.includes("agent")) {
      div.innerHTML = marked.parse(text);
    } else {
      div.textContent = text;
    }
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function setAgentContent(div, text) {
    div.innerHTML = marked.parse(text);
  }

  async function sendMessage() {
    const message = inputEl.value.trim();
    if (!message) return;

    addMessage(message, "user");
    inputEl.value = "";
    btnEl.disabled = true;
    const loadingDiv = addMessage("Thinking...", "agent loading");

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: message, session_id: sessionId }),
      });
      const data = await res.json();
      setAgentContent(loadingDiv, data.reply || "(no response)");
      loadingDiv.classList.remove("loading");
    } catch (err) {
      loadingDiv.textContent = "Error reaching the agent: " + err.message;
    } finally {
      btnEl.disabled = false;
    }
  }

  btnEl.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
